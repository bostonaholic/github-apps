<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: dark GitHub-toned square, full-bleed — GitHub rounds avatars itself -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2431"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Warden's shield -->
  <path d="M432 168 L676 256 L676 492 C676 668 572 792 432 856 C292 792 188 668 188 492 L188 256 Z"
        fill="#161b22" stroke="url(#accent)" stroke-width="56" stroke-linejoin="round"/>

  <!-- The door the warden guards: frame, leaf, handle -->
  <path d="M324 664 L324 368 A32 32 0 0 1 356 336 L508 336 A32 32 0 0 1 540 368 L540 664 Z" fill="#444c56"/>
  <path d="M364 664 L364 388 A12 12 0 0 1 376 376 L488 376 A12 12 0 0 1 500 388 L500 664 Z" fill="#161b22"/>
  <circle cx="468" cy="528" r="20" fill="url(#accent)"/>

  <!-- Merge badge, bottom-right -->
  <circle cx="768" cy="736" r="180" fill="#0d1117"/>
  <circle cx="768" cy="736" r="148" fill="url(#accent)"/>
  <!-- git-merge glyph -->
  <g stroke="#ffffff" fill="none" stroke-width="26">
    <path d="M716 676 L716 804"/>
    <path d="M716 688 C716 748 752 772 806 772"/>
  </g>
  <g fill="#ffffff">
    <circle cx="716" cy="664" r="30"/>
    <circle cx="716" cy="812" r="30"/>
    <circle cx="838" cy="772" r="30"/>
  </g>
</svg>
