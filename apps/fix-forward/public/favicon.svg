<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: dark GitHub-toned square, full-bleed — GitHub rounds avatars itself -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2431"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa657"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Motif group, nudged down to sit centered above the badge -->
  <g transform="translate(0 72)">
  <!-- The default branch, running left to right -->
  <path d="M96 288 L928 288" stroke="#444c56" stroke-width="40" stroke-linecap="round"/>

  <!-- The fix branch: leaves the red commit and merges back further along -->
  <path d="M448 288 C448 448 528 464 608 464 C688 464 768 448 768 288" fill="none"
        stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>

  <!-- Two green commits before the break -->
  <circle cx="160" cy="288" r="56" fill="#3fb950" stroke="#0d1117" stroke-width="20"/>
  <circle cx="304" cy="288" r="56" fill="#3fb950" stroke="#0d1117" stroke-width="20"/>

  <!-- The red commit that broke CI, with an X -->
  <circle cx="448" cy="288" r="64" fill="#f85149" stroke="#0d1117" stroke-width="20"/>
  <path d="M422 262 L474 314 M474 262 L422 314" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- The fix commit on the fix branch -->
  <circle cx="608" cy="464" r="56" fill="url(#accent)" stroke="#0d1117" stroke-width="20"/>

  <!-- The merge of the fix: main is green again -->
  <circle cx="768" cy="288" r="56" fill="#3fb950" stroke="#0d1117" stroke-width="20"/>

  </g>

  <!-- Badge, bottom-right -->
  <circle cx="768" cy="736" r="180" fill="#0d1117"/>
  <circle cx="768" cy="736" r="148" fill="url(#accent)"/>
  <!-- Forward arrow glyph: the fix goes forward, never back -->
  <path d="M676 736 L842 736 M786 672 L854 736 L786 800" fill="none"
        stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
